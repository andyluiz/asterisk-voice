services:
  companion:
    build:
      context: ./companion
    container_name: asterisk-hermes-companion
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./.env
    environment:
      DEBUG_RECORD_CALLS: "true"
      CALL_JOURNAL_DIR: /recordings/call-events
      CALL_JOURNAL_UID: "1000"
    volumes:
      - ./recordings:/recordings